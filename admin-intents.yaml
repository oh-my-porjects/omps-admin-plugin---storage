$schema: admin-ui-intent/v1
module: storage

entities:
  - key: storage.resource
    module: storage
    title: { fallback: 文件资源 }
    key_field: resource_id
    fields:
      - { key: resource_id, type: string }
      - { key: user_id, type: string }
      - { key: status, type: string }

relationships:
  - key: storage.resource.user
    module: storage
    source_entity: storage.resource
    source_field: user_id
    target_entity: user.user
    target_key_field: user_id
    display_fields: [account, nickname]
    lookup_capability_key: user.endpoint.get_api_admin_user_batch_lookup
    lookup_input_field: user_ids
    lookup_items_path: data.items
    detail_capability_key: user.endpoint.get_api_admin_user_detail
    lookup_mode: batch
    cardinality: many-to-one
    missing_behavior: show_error

pages:
  - key: storage.resource_list
    title: { fallback: 文件资源 }
    description: { fallback: 查询当前项目中已上传资源及其真实业务绑定状态。 }
    route: /system/resources
    menu_key: system.resources
    menu_title: { fallback: 文件资源 }
    menu_path:
      - { key: system, title: { fallback: 系统管理 }, icon: settings, order: 900 }
      - { key: system.operations, title: { fallback: 配置与运维 }, icon: settings, order: 20 }
    icon: storage
    order: 160
    template: { id: standard-list, version: 1.0.0 }
    size: md
    entity: storage.resource
    query_capability: storage.endpoint.get_api_storage_admin_resource_list
    pagination: true
    filters:
      - key: user_id
        binding: user_id
        label: { fallback: 上传用户 ID }
        control: search
      - key: feature
        binding: feature
        label: { fallback: 资源用途 }
        control: search
      - key: business_object_type
        binding: business_object_type
        label: { fallback: 业务对象类型 }
        control: search
      - key: business_object_id
        binding: business_object_id
        label: { fallback: 业务对象 ID }
        control: search
      - key: status
        binding: status
        label: { fallback: 资源状态 }
        control: select
      - key: include_history
        binding: include_history
        label: { fallback: 包含历史 }
        control: switch
    columns:
      - field: resource_id
        title: { fallback: 资源 ID }
        min_width: 190
      - field: user_id
        title: { fallback: 上传用户 }
        renderer: relation
        relation_key: storage.resource.user
        click_action: storage.resource_list.action.open_user
        min_width: 170
      - field: feature
        title: { fallback: 资源用途 }
        min_width: 150
      - field: business_object_type
        title: { fallback: 业务对象类型 }
        min_width: 170
      - field: business_object_id
        title: { fallback: 业务对象 ID }
        min_width: 180
      - field: status
        title: { fallback: 状态 }
        renderer: enum
        min_width: 100
      - field: public_url
        title: { fallback: 文件预览 }
        renderer: image
        min_width: 130
      - field: uploaded_ts
        title: { fallback: 上传时间 }
        min_width: 150
    actions:
      - key: storage.resource_list.action.open_user
        type: open-dialog
        source: row
        title: { fallback: 查看用户 }
        relation_key: storage.resource.user
      - key: storage.resource_list.action.upload
        type: open-dialog
        source: page
        title: { fallback: 上传资源 }
        overlay:
          type: open-dialog
          title: { fallback: 上传资源 }
          template: { id: standard-form, version: 1.0.0 }
          size: md
          fields:
            - binding: files
              label: { fallback: 图片文件 }
              control: upload
              required: true
            - binding: feature
              label: { fallback: 资源用途 }
              control: select
              required: true
              options:
                - value: recharge_voucher
                  label: { fallback: 充值凭证截图 }
            - binding: business_object_type
              label: { fallback: 业务对象类型 }
              control: select
              options:
                - value: recharge_order
                  label: { fallback: 充值订单 }
                - value: user_profile
                  label: { fallback: 用户资料 }
            - binding: business_object_id
              label: { fallback: 业务对象 ID }
              control: input
          submit_action:
            key: storage.resource_list.action.upload.submit
            type: submit
            source: form
            title: { fallback: 开始上传 }
            capability_key: storage.endpoint.post_api_storage_upload
            confirm:
              title: { fallback: 确认上传资源 }
              description: { fallback: 文件将写入当前项目的受控存储，并立即生成可追溯的资源记录。 }
            bindings:
              files: { source: form, key: files, required: true }
              feature: { source: form, key: feature, required: true }
              business_object_type: { source: form, key: business_object_type }
              business_object_id: { source: form, key: business_object_id }
            success_effects:
              - type: notify
      - key: storage.resource_list.action.detail
        type: open-dialog
        source: row
        title: { fallback: 查看详情 }
        bindings:
          resource_id: { source: row, key: resource_id, required: true }
        overlay:
          type: open-dialog
          title: { fallback: 文件资源详情 }
          template: { id: standard-detail, version: 1.0.0 }
          size: md
          detail_capability: storage.endpoint.get_api_storage_admin_resource_detail
          fields:
            - binding: resource_id
              label: { fallback: 资源 ID }
            - binding: batch_id
              label: { fallback: 上传批次 }
            - binding: user_id
              label: { fallback: 上传用户 }
              renderer: relation
              relation_key: storage.resource.user
              click_action: storage.resource_detail.action.open_user
            - binding: feature
              label: { fallback: 资源用途 }
            - binding: business_object_type
              label: { fallback: 业务对象类型 }
            - binding: business_object_id
              label: { fallback: 业务对象 ID }
            - binding: public_url
              label: { fallback: 公网地址 }
            - binding: status
              label: { fallback: 状态 }
            - binding: original_filename
              label: { fallback: 原始文件名 }
            - binding: file_size_bytes
              label: { fallback: 文件大小 }
            - binding: uploaded_ts
              label: { fallback: 上传时间 }
          actions:
            - key: storage.resource_detail.action.open_user
              type: open-dialog
              source: row
              title: { fallback: 查看用户 }
              relation_key: storage.resource.user
