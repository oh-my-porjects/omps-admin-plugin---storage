$schema: admin-web-spec/v3
module: storage
module_title: 文件存储
menus:
  - key: resources
    title: 资源列表
    icon: file
    permission_key: storage.resources.page
    default_effect: visible
    views: [resource_list]
views:
  - key: resource_list
    type: table
    title: 资源
    api: GET /api/storage/admin/resource-list
    request:
      query:
        - param: user_id
          source: filter
          key: user_id
          transform: trim
        - param: feature
          source: filter
          key: feature
          transform: identity
        - param: business_object_type
          source: filter
          key: business_object_type
          transform: identity
        - param: business_object_id
          source: filter
          key: business_object_id
          transform: trim
        - param: status
          source: filter
          key: status
          transform: identity
        - param: uploaded_from_ts
          source: filter
          key: uploaded_ts
          transform: range_start
        - param: uploaded_to_ts
          source: filter
          key: uploaded_ts
          transform: range_end
        - param: include_history
          source: filter
          key: include_history
          transform: identity
      pagination:
        page: page
        page_size: page_size
    filters:
      - key: user_id
        title: 上传用户 ID
        type: text
      - key: feature
        title: 资源用途
        type: enum
        enum:
          recharge_voucher: 充值凭证
      - key: business_object_type
        title: 业务对象类型
        type: enum
        enum:
          recharge_order: 充值订单
          user_profile: 用户资料
      - key: business_object_id
        title: 业务对象 ID
        type: text
      - key: status
        title: 资源状态
        type: enum
        enum:
          normal: 正常
          deleted: 已删除
          cleaned: 已清理
      - key: uploaded_ts
        title: 上传时间
        type: daterange
      - key: include_history
        title: 包含历史
        type: bool
    columns:
      - field: resource_id
        title: 资源 ID
        permission_key: storage.resource_list.field.resource_id
        default_effect: visible
      - field: user_id
        title: 上传用户 ID
        permission_key: storage.resource_list.field.user_id
        default_effect: visible
      - field: feature
        title: 资源类型
        permission_key: storage.resource_list.field.feature
        default_effect: visible
      - field: business_object_type
        title: 业务对象类型
        permission_key: storage.resource_list.field.business_object_type
        default_effect: visible
      - field: business_object_id
        title: 业务对象 ID
        permission_key: storage.resource_list.field.business_object_id
        default_effect: visible
      - field: public_url
        title: 文件名
        permission_key: storage.resource_list.field.public_url
        default_effect: visible
      - field: file_size_bytes
        title: 大小
        render: number
        permission_key: storage.resource_list.field.file_size_bytes
        default_effect: visible
      - field: mime_type
        title: 类型
        permission_key: storage.resource_list.field.mime_type
        default_effect: visible
      - field: status
        title: 状态
        permission_key: storage.resource_list.field.status
        default_effect: visible
      - field: uploaded_ts
        title: 上传时间
        render: datetime
        permission_key: storage.resource_list.field.uploaded_ts
        default_effect: visible
