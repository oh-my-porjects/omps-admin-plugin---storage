module: storage
module_title: 文件存储
menus:
  - key: resources
    title: 资源列表
    icon: file
    roles: [admin, developer, operator]
    views: [resource_list]
  - key: monitor
    title: 存储监控
    icon: dashboard
    roles: [admin, developer]
    views: [storage_monitor]
views:
  - key: resource_list
    type: table
    title: 资源
    api: GET /api/storage/list
    columns:
      - field: id
        title: ID
      - field: name
        title: 文件名
      - field: size
        title: 大小
        render: number
      - field: mime
        title: 类型
      - field: storage_backend
        title: 存储后端
      - field: created_at
        title: 上传时间
        render: datetime
    actions:
      - key: upload
        type: page
        title: 上传
        api: POST /api/storage/upload
      - key: delete
        type: row
        title: 删除
        api: DELETE /api/storage/{id}
        danger: true
  - key: storage_monitor
    type: stats
    title: 存储监控
    api: GET /api/storage/stats
roles:
  - code: admin
    title: 超级管理员
  - code: developer
    title: 开发者
  - code: operator
    title: 运维
