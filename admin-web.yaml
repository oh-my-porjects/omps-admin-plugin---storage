module: storage
module_title: 文件存储
menus:
  - key: resources
    title: 资源列表
    icon: file
    roles: [admin, developer, operator]
    views: [resource_list]
views:
  - key: resource_list
    type: table
    title: 资源
    api: GET /api/storage/resource-list
    columns:
      - field: resource_id
        title: 资源 ID
      - field: feature
        title: 资源类型
      - field: public_url
        title: 文件名
      - field: file_size_bytes
        title: 大小
        render: number
      - field: mime_type
        title: 类型
      - field: status
        title: 状态
      - field: uploaded_at
        title: 上传时间
        render: datetime
    actions:
      - key: upload
        type: page
        title: 上传
        api: POST /api/storage/upload
        fields:
          - field: file
            title: 图片文件
            type: file
            required: true
          - field: feature
            title: 资源用途
            type: enum
            required: true
            default: recharge_voucher
            enum:
              recharge_voucher: 充值凭证
          - field: business_object_type
            title: 业务对象类型
            type: enum
            enum:
              recharge_order: 充值订单
              user_profile: 用户资料
          - field: business_object_id
            title: 业务对象 ID
            type: string
roles:
  - code: admin
    title: 超级管理员
  - code: developer
    title: 开发者
  - code: operator
    title: 运维
